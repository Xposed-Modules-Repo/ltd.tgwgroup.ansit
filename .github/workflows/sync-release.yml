name: Sync AnsIt release

on:
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'

permissions:
  contents: write

concurrency:
  group: ansit-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the module repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify and sync published releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_release.py
